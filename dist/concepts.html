function heroArt(){return `<div class="hero-art"><span class="art-label">Every decision opens a new path</span><svg viewBox="0 0 530 260" role="img" aria-label="Illustration of a poker decision tree"><g stroke="#63745b" fill="none"><path d="M130 128 H210 V70 H287 M210 128 V192 H287 M383 70 H419 V110 H451"/><path d="M210 128 H287" stroke-dasharray="4 5"/></g><g font-family="sans-serif" font-size="11"><rect x="39" y="104" width="110" height="48" rx="8" fill="#2b3d30" stroke="#66795a"/><text x="94" y="124" text-anchor="middle" fill="#eff2e9">Button opens</text><text x="94" y="140" text-anchor="middle" fill="#94ad95" font-size="9">2.5 BB</text><rect x="278" y="46" width="108" height="48" rx="8" fill="#dcf58c"/><text x="332" y="67" text-anchor="middle" fill="#273523">Big blind calls</text><text x="332" y="83" text-anchor="middle" fill="#55703b" font-size="9">EXPLORE THIS LINE ↗</text><rect x="278" y="171" width="108" height="44" rx="8" fill="#23352c" stroke="#50694e"/><text x="332" y="197" text-anchor="middle" fill="#a9ba9f">Big blind 3-bets</text><circle cx="287" cy="128" r="4" fill="#63745b"/><rect x="442" y="85" width="56" height="58" rx="6" fill="#eeeede"/><text x="470" y="112" text-anchor="middle" fill="#304331" font-size="19">A♠</text><text x="470" y="131" text-anchor="middle" fill="#708265" font-size="8">THE FLOP</text></g></svg><span class="art-bottom">Different paths. The same starting question.</span></div>`}
function home(){let ids=concepts.map((_,i)=>i+1).filter(i=>homeFilter==='all'||saved.includes(i));return `${bar()}<main class="home"><section class="hero"><div><div class="eyebrow">Nodeway / An interactive starting point</div><h1>One game.<br><em>Ten ways in.</em></h1><p>A tree, a table, a trail of decisions. Try ten ways to explore poker nodes and find the one that feels right.</p><div class="hero-foot"><span><i class="small-dot"></i> 10 working concepts</span><span>Click through. Compare. Pick a direction.</span></div></div>${heroArt()}</section><section aria-label="Ten concepts"><div class="section-top"><div><h2>Choose a way to explore <span style="color:var(--muted);font-size:14px">/ 10</span></h2><p>Different journeys, shared sample content. No right answer.</p></div><div class="tabs"><button class="${homeFilter==='all'?'active':''}" onclick="setHomeFilter('all')">All concepts</button><button class="${homeFilter==='saved'?'active':''}" onclick="setHomeFilter('saved')">Shortlist · ${saved.length}</button></div></div><div class="concept-grid">${ids.map(i=>`<article class="concept"><button class="save-mini ${saved.includes(i)?'saved':''}" aria-label="${saved.includes(i)?'Remove':'Add'} ${concepts[i-1][0]} ${saved.includes(i)?'from':'to'} shortlist" aria-pressed="${saved.includes(i)}" onclick="toggleSave(${i})">${saved.includes(i)?'★':'☆'}</button><a class="concept-link" href="#concept/${i}"><div class="mini"><span class="concept-no">${String(i).padStart(2,'0')}</span>${miniSvg(icons[i-1])}</div><div class="concept-body"><div class="concept-title"><h3>${concepts[i-1][0]}</h3><span>↗</span></div><p>${concepts[i-1][1]}</p><span class="chip">${concepts[i-1][2]}</span></div></a></article>`).join('')}</div>${!ids.length?'<div class="empty-state">No favourites yet. Tap the ☆ on any concept to keep it here.<br><button style="margin-top:18px" onclick="setHomeFilter(\'all\')">Explore all ten</button></div>':''}</section>${footer()}</main>`}
function footer(){return '<footer class="foot"><span>NODEWAY · CONCEPT LAB<br>Built to make the brief a little easier.</span><span>All hands, charts and numbers are illustrative sample data.<br>No solver calculations or poker recommendations.</span></footer>'}
function shell(){let c=concepts[mode-1];return `${bar()}<div class="workspace"><aside class="sidebar"><a href="#home">← All concepts</a><div class="sidebar-label">Find your way</div>${concepts.map((c,i)=>`<a href="#concept/${i+1}" class="nav-item ${mode===i+1?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${c[0]}</a>`).join('')}<div class="note" style="margin:24px 12px 0">Same idea. Ten ways to use it.<br>☆ Save the ones that click.</div></aside><main class="main"><div class="work-top"><div><div class="eyebrow">Concept ${String(mode).padStart(2,'0')} / ${c[2]}</div><h1>${c[0]}</h1><p>${c[1]}</p></div><div class="work-actions"><select class="mode-select" aria-label="Choose concept" onchange="location.hash=this.value"><option value="home">All concepts</option>${concepts.map((c,i)=>`<option value="concept/${i+1}" ${mode===i+1?'selected':''}>${i+1}. ${c[0]}</option>`).join('')}</select><button class="${saved.includes(mode)?'saved':''}" aria-pressed="${saved.includes(mode)}" onclick="toggleSave(${mode})">${saved.includes(mode)?'★ Shortlisted':'☆ Shortlist this'}</button><button onclick="resetMode()" aria-label="Reset this concept">↺ Reset</button></div></div><div class="hint"><b>TRY IT →</b><span>${c[3]}</span></div><div id="experience">${experience()}</div><nav class="bottom-nav"><a href="${mode===1?'#home':'#concept/'+(mode-1)}">← ${mode===1?'All concepts':concepts[mode-2][0]}</a><a href="#home">${mode} / 10</a><a href="${mode===10?'#home':'#concept/'+(mode+1)}">${mode===10?'Back to all concepts':concepts[mode][0]} →</a></nav>${footer()}</main></div>`}
function cards(board,empty=0){return `<div class="cards">${board.map(c=>`<span class="card ${/[♥♦]/.test(c)?'red':''}">${c.slice(0,-1)}<small>${c.slice(-1)}</small></span>`).join('')}${Array.from({length:empty},()=>'<span class="card empty">·</span>').join('')}</div>`}
function actionBars(freq){return `<div class="bars">${freq.map((n,i)=>`<div class="bar-line"><span>${['Aggressive','Passive','Fold'][i]}</span><div class="bar-track"><i style="width:${n}%;background:${['var(--lime)','var(--green)','var(--orange)'][i]}"></i></div><span>${n}%</span></div>`).join('')}</div>`}
function lineChart(n){const vals=[40+n.id%5,45+n.id%6,Math.max(25,n.eq-13),n.eq-4,n.eq];const pts=vals.map((v,i)=>`${35+i*66},${106-v}`).join(' ');return `<svg class="line-chart" viewBox="0 0 320 130" role="img" aria-label="Illustrative equity trend ending at ${n.eq} percent"><g stroke="#3a4a40" stroke-dasharray="3 4"><path d="M35 26H299 M35 56H299 M35 86H299"/></g><g fill="#879e90" font-size="8"><text x="7" y="29">80%</text><text x="7" y="59">50%</text><text x="7" y="89">20%</text></g><polygon points="35,106 ${pts} 299,106" fill="#81bfa514"/><polyline points="${pts}" stroke="#a8d788" stroke-width="2.5" fill="none"/>${vals.map((v,i)=>`<circle cx="${35+i*66}" cy="${106-v}" r="3" fill="#dcf58c"/>`).join('')}<g fill="#96a99b" font-size="8"><text x="25" y="124">Start</text><text x="94" y="124">Open</text><text x="160" y="124">Flop</text><text x="226" y="124">Turn</text><text x="284" y="124">Now</text></g></svg>`}
function detail(id,options={}){const n=options.node||nodes[id];return `<div class="panel"><div class="panel-head"><span class="pill">${n.tag} · NODE ${String(n.id+1).padStart(2,'0')}</span><span class="tiny">Sample visual</span></div><div class="panel-body"><div class="node-path">${esc(n.path)}</div><h2 class="node-title">${esc(n.title)}</h2><p class="node-summary">${esc(n.desc)}</p>${n.board.length?cards(n.board):cards(['A♠','K♠'])}<div class="metrics"><div class="metric"><span>Pot</span><b>${n.pot}<small style="font-size:11px"> bb</small></b></div><div class="metric"><span>Sample equity</span><b>${n.eq}%</b></div><div class="metric"><span>Sample EV</span><b>+${n.ev}<small style="font-size:11px"> bb</small></b></div></div><div class="chart-title"><span>Illustrative action mix</span><span>100% of sample</span></div>${actionBars(n.freq)}<div class="chart-title"><span>Equity across this sample line</span></div>${lineChart(n)}${options.noNext?'':`<div class="detail-links"><div class="kicker">${n.next.length?'Connected nodes':'End of this sample line'}</div><div class="row">${n.next.map(i=>`<button onclick="jumpNode(${i})">${nodes[i].title} →</button>`).join('')}${!n.next.length?'<button onclick="jumpNode(0)">↺ Back to starting node</button>':''}</div></div>`}</div></div>`}
function treeView(){const treeNodes=[{id:0,x:15,y:158},{id:1,x:230,y:70},{id:2,x:230,y:275},{id:3,x:450,y:20},{id:4,x:450,y:130},{id:5,x:450,y:285}];return `<div class="split"><section class="panel"><div class="panel-head"><h3>Button vs big blind</h3><div class="row"><button aria-label="Zoom out tree" onclick="treeScale(-.15)" style="padding:5px 10px">−</button><span class="tiny">${Math.round(treeZoom*100)}%</span><button aria-label="Zoom in tree" onclick="treeScale(.15)" style="padding:5px 10px">+</button></div></div><div class="tree-scroll dotgrid"><svg class="tree-svg" style="transform:scale(${treeZoom})" viewBox="0 0 660 400" aria-label="Interactive poker decision tree"><g stroke="#607860" fill="none" stroke-width="1.4"><path d="M165 196H195V108H230 M195 196V313H230 M380 108H415V58H450 M415 108V168H450 M380 313H450"/></g>${treeNodes.map(p=>`<g tabindex="0" role="button" aria-label="Open ${nodes[p.id].title}" onclick="jumpNode(${p.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpNode(${p.id})}"><rect x="${p.x}" y="${p.y}" width="150" height="76" rx="8" fill="${selectedNode===p.id?'#394d30':'#22332b'}" stroke="${selectedNode===p.id?'#dcf58c':'#546b55'}"/><text x="${p.x+14}" y="${p.y+21}" fill="#9eaf9e" font-size="9">${nodes[p.id].tag.toUpperCase()}</text><text x="${p.x+14}" y="${p.y+42}" fill="#e7edde" font-size="12">${nodes[p.id].title}</text><text x="${p.x+14}" y="${p.y+61}" fill="#bfd98d" font-size="10">${nodes[p.id].board.join(' ')||nodes[p.id].pot+'bb pot'} ↗</text></g>`).join('')}</svg></div><div class="image-caption">Select a node to inspect it. Use its connected-node buttons to go deeper.</div></section><div id="detail">${detail(selectedNode)}</div></div>`}
function guided(){let opts=wizard.step===0?['BTN','CO','SB','BB']:wizard.step===1?['Call','3-bet']:['Ace-high','Connected','Paired'];let keys=['position','response','board'];let titles=['Where do you want to start?','How does the big blind respond?','Which flop would you like to explore?'];let s=wizard.step;let result=wizardNode();return `<div class="wizard"><div class="stepper">${['Position','Response','Board','Explore'].map((x,i)=>`<div class="step ${i<=s?'active':''}">${i+1} · ${x}</div>`).join('')}</div><div class="crumbs">${keys.slice(0,Math.min(s,3)).map((k,i)=>`<button onclick="wizard.step=${i};updateExperience()">${esc(wizard[k])} ↗</button>`).join('')}</div>${s<3?`<section class="panel"><div class="panel-body"><div class="kicker">Step ${s+1} of 3</div><h2>${titles[s]}</h2><p style="font-size:12px">Pick an option to shape your sample journey.</p><div class="choice-grid">${opts.map((o,i)=>`<button class="choice ${wizard[keys[s]]===o?'selected':''}" onclick="wizard['${keys[s]}']='${o}';updateExperience()"><strong>${o}</strong><span>${s===0?({BTN:'Button · on the dealer',CO:'Cutoff · before the button',SB:'Small blind · out of position',BB:'Big blind · defend your blind'})[o]:s===1?(i===0?'Continue in a single-raised pot':'Explore a reraised pot'):['A♠ 7♦ 2♣ · dry texture','9♥ 8♠ 6♥ · dynamic texture','K♣ K♦ 4♠ · paired texture'][i]}</span></button>`).join('')}</div><div class="row spread"><button ${s===0?'disabled':''} onclick="wizard.step--;updateExperience()">← Back</button><button class="primary" onclick="wizard.step++;updateExperience()">${s===2?'Show my node':'Continue'} →</button></div></div></section>`:`${detail(result.id,{node:result,noNext:true})}<div class="row spread" style="margin-top:18px"><button onclick="wizard.step=2;updateExperience()">← Change board</button><button class="primary" onclick="wizard.step=0;updateExperience()">Try another journey ↗</button></div>`}</div>`}
function wizardNode(){let n={...nodes[wizard.response==='3-bet'?5:wizard.board==='Connected'?4:3]};n.board=wizard.board==='Paired'?['K♣','K♦','4♠']:wizard.board==='Connected'?['9♥','8♠','6♥']:['A♠','7♦','2♣'];const offset=['BTN','CO','SB','BB'].indexOf(wizard.position);n.eq-=offset*3;n.ev=+(n.ev-offset*.2).toFixed(1);n.title=wizard.position+' · '+wizard.board+' flop';n.path=wizard.position+' / BB '+wizard.response+' / '+wizard.board;n.desc='Your chosen route: '+wizard.position+' position, '+wizard.response.toLowerCase()+' response and '+wizard.board.toLowerCase()+' board. Each selection leads to a different illustrative result.';return n}
const folders=[{name:'Preflop',sub:'Opening decisions',ids:[0,1,2]},{name:'Flop textures',sub:'Find a board type',ids:[3,4,5]},{name:'Betting lines',sub:'Explore an action',ids:[6,7,9,10]},{name:'Later streets',sub:'Turn & river',ids:[8,9,10,11]}];
function libraryView(){return `<div class="crumbs"><button onclick="folder=0;selectedNode=0;updateExperience()">Study library</button><span class="subtle">/</span><span class="path-pill">100bb cash games</span><span class="subtle">/ ${folders[folder].name}</span></div><div class="split"><section class="panel"><div class="panel-head"><h3>Browse your study</h3><span class="tiny">${folders[folder].ids.length} nodes</span></div><div class="file-columns"><nav class="folder-list" aria-label="Study folders">${folders.map((f,i)=>`<button class="${folder===i?'selected':''}" onclick="folder=${i};selectedNode=folders[${i}].ids[0];updateExperience()">▱ &nbsp;${f.name}<small>${f.sub}</small></button>`).join('')}</nav><div class="file-list">${folders[folder].ids.map(i=>`<button class="file-item ${selectedNode===i?'selected':''}" onclick="jumpNode(${i})"><span class="file-icon">▥</span><span>${nodes[i].title}<small>${nodes[i].tag} · chart + node details</small></span><span class="arrow">→</span></button>`).join('')}</div></div><div class="image-caption">A familiar folder structure, with a live preview beside your files.</div></section>${detail(selectedNode)}</div>`}
function tableView(){let n={...nodes[tableAction==='3-bet'?2:tableAction==='Call'?1:0]};n.title=seat+' · '+tableAction;n.path='6-max table / '+seat+' / '+tableAction;n.eq=Math.max(30,n.eq-['BTN','SB','BB','UTG','HJ','CO'].indexOf(seat)*2);n.desc='You selected the '+seat+' seat and '+tableAction.toLowerCase()+' action. This is the attached sample node and chart.';return `<div class="split"><div class="stack"><section class="panel"><div class="panel-head"><h3>Choose a seat at the table</h3><span class="pill">6-max · 100bb</span></div><div class="table-stage"><div class="poker-table"><span class="kicker" style="color:#a8c7aa">NODEWAY / CASH TABLE</span>${cards(['A♠','K♠'])}<span class="tiny" style="color:#bed3b7">${seat} selected · ${n.pot}bb pot</span></div>${['UTG','HJ','CO','BTN','SB','BB'].map((s,i)=>`<button class="seat seat-${i} ${seat===s?'selected':''}" onclick="seat='${s}';updateExperience()">${s}${s==='BTN'?' Ⓓ':''}<small>100 bb</small></button>`).join('')}</div></section><section class="panel"><div class="panel-body"><div class="kicker">Choose ${seat}'s action</div><div class="row">${['Open','Call','3-bet'].map(a=>`<button class="${tableAction===a?'selected':''}" onclick="tableAction='${a}';updateExperience()">${a} →</button>`).join('')}</div><p class="tiny" style="margin-top:13px">Seat and action combinations are independent interface examples.</p></div></section></div>${detail(n.id,{node:n,noNext:true})}</div>`}
const ranks=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];function handName(i,j){return i===j?ranks[i]+ranks[j]:i<j?ranks[i]+ranks[j]+'s':ranks[j]+ranks[i]+'o'}
function rangeView(){let seed=hand.split('').reduce((a,c)=>a+c.charCodeAt(0),0),eq=35+seed%43;let aggressive=30+seed%50,passive=Math.min(85-aggressive,15+seed%20);let n={...nodes[rangeAction==='Raise'?6:rangeAction==='Call'?1:0],title:hand+(rangeAction?' → '+rangeAction:''),eq,ev:+(eq/20-1).toFixed(1),freq:[aggressive,passive,100-aggressive-passive],path:'Hand grid / '+hand+(rangeAction?' / '+rangeAction:''),desc:rangeAction?'Following the '+rangeAction.toLowerCase()+' branch for '+hand+'. The attached sample chart changes with the selected hand.':'Select a hand to inspect its sample mix. Then choose an action below the grid to continue.'};return `<div class="split"><section class="panel"><div class="panel-head"><h3>Button opening range</h3><span class="pill">169 hand classes</span></div><div class="panel-body"><div class="range-grid">${ranks.flatMap((r,i)=>ranks.map((q,j)=>{let h=handName(i,j);return `<button class="range-cell ${hand===h?'active':''}" style="background:${i===j?'#dcf58c':i+j<8?'#8bc5a4':i+j<15?'#668d75':'#3c5c4b'};color:${i+j>=15?'#d0dfcf':'#183024'}" aria-label="Select ${h}" aria-pressed="${hand===h}" onclick="hand='${h}';rangeAction='';updateExperience()">${h}</button>`})).join('')}</div><div class="range-legend"><span><i style="background:var(--lime)"></i>Pairs</span><span>Above diagonal: suited</span><span>Below: offsuit</span></div><div class="note">Selected hand: <strong style="color:var(--lime)">${hand}</strong> · Follow an action</div><div class="row line-actions">${['Raise','Call','Fold'].map(a=>`<button class="${rangeAction===a?'selected':''}" onclick="rangeAction='${a}';updateExperience()">${a} →</button>`).join('')}</div><p class="tiny" style="margin-top:15px">Cell colours illustrate range density; they are not solver output.</p></div></section>${detail(n.id,{node:n,noNext:true})}</div>`}
const replayIds=[0,1,3,9,11];const replayTitles=['Button raises to 2.5bb','Big blind makes the call','Flop: A♠ 7♦ 2♣','Turn: Q♥','River: 3♠'];
function replayView(){let n=nodes[replayIds[replay]];return `<div class="split"><section class="panel"><div class="panel-head"><h3>A hand, one moment at a time</h3><span class="pill">${replay+1} / 5</span></div><div class="panel-body"><div class="replay-stage"><div class="kicker">${n.tag} · BTN vs BB</div>${cards(n.board,5-n.board.length)}<h2>${replayTitles[replay]}</h2><p>${n.pot}bb pot · 100bb starting stacks</p></div><div class="timeline">${['Open','Call','Flop','Turn','River'].map((t,i)=>`<button class="${replay===i?'active':''}" onclick="setReplay(${i})">${t}</button>`).join('')}</div><label for="replay-slider" class="sr-only">Move through hand</label><input id="replay-slider" class="slider" type="range" min="0" max="4" value="${replay}" oninput="setReplay(+this.value)"><div class="replay-controls"><button ${replay===0?'disabled':''} onclick="setReplay(replay-1)" aria-label="Previous moment">←</button><button class="primary" onclick="togglePlay()">${playing?'Ⅱ Pause replay':'▶ Play hand'}</button><button ${replay===4?'disabled':''} onclick="setReplay(replay+1)" aria-label="Next moment">→</button></div><p class="tiny">Each stop loads the relevant node, board and sample graph.</p></div></section>${detail(n.id,{noNext:true})}</div>`}
function compareView(){let a=nodes[compare[0]],b=nodes[compare[1]],delta=+(a.ev-b.ev).toFixed(1);return `<div class="compare-grid">${compare.map((id,i)=>`<section><div class="row spread" style="margin-bottom:14px"><span class="kicker" style="margin:0">${i?'Line B':'Line A'}</span><select aria-label="Choose line ${i?'B':'A'}" onchange="compare[${i}]=+this.value;updateExperience()">${nodes.map(n=>`<option value="${n.id}" ${id===n.id?'selected':''}>${n.title}</option>`).join('')}</select></div>${detail(id,{noNext:true})}</section>`).join('')}</div><div class="compare-summary"><div><div class="kicker">Sample difference · A minus B</div><p style="font-size:12px">${esc(a.title)} compared with ${esc(b.title)}.</p></div><div><b>${delta>0?'+':''}${delta} bb</b><span class="subtle"> sample EV &nbsp; / &nbsp; ${a.eq-b.eq>0?'+':''}${a.eq-b.eq} pts equity</span></div></div><p class="tiny" style="margin-top:12px">Comparison of invented values only. This does not identify a better poker strategy.</p>`}
function atlasArt(n){let color=n.id%2?'#b3dba2':'#dcf58c';let bars=n.freq.map((v,i)=>`<rect x="${100+i*95}" y="${230-v*1.6}" width="54" height="${v*1.6}" rx="4" fill="${[color,'#81bfa5','#d8a577'][i]}"/><text x="${127+i*95}" y="251" font-size="10" fill="#b1c5af" text-anchor="middle">${['Aggressive','Passive','Fold'][i]}</text><text x="${127+i*95}" y="${218-v*1.6}" font-size="12" fill="#ecf3df" text-anchor="middle">${v}%</text>`).join('');return `<svg viewBox="0 0 450 290" role="img" aria-label="${esc(n.title)} action frequency image"><rect width="450" height="290" fill="#18281f"/><g stroke="#38503c" stroke-dasharray="3 5"><path d="M65 100H390 M65 160H390 M65 230H390"/></g><text x="35" y="35" fill="#95b38e" font-size="10" letter-spacing="2">${n.tag.toUpperCase()} / SAMPLE ${String(n.id+1).padStart(2,'0')}</text><text x="35" y="62" fill="#e7efdc" font-size="20">${esc(n.title)}</text>${bars}<text x="35" y="277" fill="#819c82" font-size="9">${n.board.join('  ')||'BTN vs BB · 100bb'} · ILLUSTRATIVE DATA</text></svg>`}
function galleryView(){if(galleryIndex!==null){let n=nodes[galleryIndex];return `<div class="row spread" style="margin-bottom:18px"><button onclick="galleryIndex=null;updateExperience()">← Back to visual atlas</button><div class="row"><button onclick="galleryIndex=(galleryIndex+11)%12;updateExperience()" aria-label="Previous image">←</button><span class="subtle">${galleryIndex+1} / 12</span><button onclick="galleryIndex=(galleryIndex+1)%12;updateExperience()" aria-label="Next image">→</button></div></div><div class="gallery-view"><div class="stack"><div class="big-art">${atlasArt(n)}</div><div class="panel"><div class="panel-body"><div class="kicker">Related visuals</div><div class="row">${(n.next.length?n.next:[0,3]).map(i=>`<button onclick="galleryIndex=${i};updateExperience()">${nodes[i].title} ↗</button>`).join('')}</div></div></div></div>${detail(n.id,{noNext:true})}</div>`}let list=nodes.filter(n=>galleryFilter==='All'||n.tag===galleryFilter);return `<div class="filter-row">${['All','Preflop','Flop','Turn','River'].map(t=>`<button class="${t===galleryFilter?'selected':''}" onclick="galleryFilter='${t}';updateExperience()">${t}</button>`).join('')}<span class="filtercount" style="margin:auto 0 auto auto">${list.length} visuals</span></div><div class="gallery-grid">${list.map(n=>`<button class="gallery-card" onclick="galleryIndex=${n.id};updateExperience()"><div class="gallery-art">${atlasArt(n)}</div><div class="gallery-copy"><h3>${n.title} ↗</h3><p>${n.tag} · ${n.board.join(' ')||'100bb starting spot'}</p></div></button>`).join('')}</div>`}
function searchView(){return `<div class="split"><section><label class="sr-only" for="node-search">Search situations</label><div class="search-box"><span>⌕</span><input id="node-search" value="${esc(query)}" placeholder="Try “ace”, “3-bet”, “turn” or “BTN”…" oninput="query=this.value;updateSearchResults()"><span class="shortcut">/</span></div><div class="filter-row">${['All','Preflop','Flop','Turn','River'].map(t=>`<button class="${t===searchTag?'selected':''}" onclick="searchTag='${t}';updateExperience()">${t}</button>`).join('')}</div><div id="search-results">${searchResults()}</div><p class="keyboard-tip">Press <span class="shortcut">/</span> to search · Press <span class="shortcut">Enter</span> in search to open the first result.</p></section><div id="search-detail">${searchNode===null?'<div class="panel"><div class="empty-state"><div style="font-size:40px;color:var(--lime);margin-bottom:18px">⌕</div><h3>Find your starting point</h3><p style="font-size:12px;margin-top:12px">Search the 12 sample nodes.<br>Select a result to see its board and graphs.</p></div></div>':detail(searchNode)}</div></div>`}
function matches(){let terms=query.toLowerCase().trim().split(/\s+/).filter(Boolean);return nodes.filter(n=>(searchTag==='All'||n.tag===searchTag)&&terms.every(t=>(n.title+' '+n.tag+' '+n.path+' '+n.desc+' '+n.board.join(' ')).toLowerCase().includes(t)))}
function searchResults(){let list=matches();return `<div class="tiny" style="margin-bottom:12px">${list.length} matching ${list.length===1?'node':'nodes'}</div>${list.length?list.map(n=>`<button class="search-result ${searchNode===n.id?'selected':''}" onclick="searchNode=${n.id};updateExperience()"><span class="result-no">${String(n.id+1).padStart(2,'0')}</span><div><h3>${n.title}</h3><p>${n.tag} · ${n.path}</p></div><span class="arrow">↗</span></button>`).join(''):'<div class="empty-state">No matching nodes.<br>Try “flop”, “button” or clear your filters.<br><button style="margin-top:15px" onclick="query=\'\';searchTag=\'All\';updateExperience()">Clear search</button></div>'}`}
function canvasView(){return `<div class="split"><section class="panel"><div class="panel-head"><h3>Your study map</h3><div class="row"><button style="padding:5px 9px" aria-label="Zoom out canvas" onclick="canvasScale(-.1)">−</button><span class="tiny">${Math.round(canvasZoom*100)}%</span><button style="padding:5px 9px" aria-label="Zoom in canvas" onclick="canvasScale(.1)">+</button></div></div><div class="canvas dotgrid"><div style="position:relative;width:${780*canvasZoom}px;height:${530*canvasZoom}px"><div class="canvas-inner" style="position:absolute;transform:scale(${canvasZoom})"><svg id="canvas-lines" aria-hidden="true">${canvasLines()}</svg>${positions.map(p=>`<button class="canvas-node ${selectedNode===p.id?'selected':''}" data-node="${p.id}" style="left:${p.x}px;top:${p.y}px" aria-label="${nodes[p.id].title}. Drag to move or press Enter to open." onpointerdown="startDrag(event,${p.id})" onclick="canvasClick(event,${p.id})"><small>${nodes[p.id].tag.toUpperCase()} · ${String(p.id+1).padStart(2,'0')}</small><strong>${nodes[p.id].title}</strong><span>${nodes[p.id].board.join(' ')||nodes[p.id].pot+'bb pot'} ↗</span></button>`).join('')}</div></div></div><div class="image-caption">Drag to rearrange · Click to inspect · Connections follow the nodes</div></section>${detail(selectedNode)}</div>`}
function canvasLines(){return [[0,1],[0,2],[1,3],[1,4],[2,5]].map(([a,b])=>{let p=positions.find(p=>p.id===a),q=positions.find(p=>p.id===b);return `<path d="M${p.x+150} ${p.y+48} C${p.x+200} ${p.y+48},${q.x-50} ${q.y+48},${q.x} ${q.y+48}" fill="none" stroke="#74886a" stroke-width="1.5"/>`}).join('')}
function experience(){return [treeView,guided,libraryView,tableView,rangeView,replayView,compareView,galleryView,searchView,canvasView][mode-1]()}
function render(){document.getElementById('app').innerHTML=mode?shell():home();document.title=mode?concepts[mode-1][0]+' · Nodeway':'Nodeway — Ten ways in'}
function updateExperience(){let e=$('#experience');if(e)e.innerHTML=experience()}
function route(){stopPlay();const m=location.hash.match(/^#concept\/(\d+)$/);mode=m&&+m[1]>=1&&+m[1]<=10?+m[1]:0;selectedNode=0;render();if(mode===10)fitCanvas();window.scrollTo(0,0)}
function resetMode(){stopPlay();selectedNode=0;treeZoom=1;wizard={step:0,position:'BTN',response:'Call',board:'Ace-high'};folder=0;seat='BTN';tableAction='Open';hand='AKs';rangeAction='';replay=0;compare=[6,7];galleryFilter='All';galleryIndex=null;query='';searchTag='All';searchNode=null;positions=initialPositions.map(p=>({...p}));canvasZoom=1;updateExperience();if(mode===10)fitCanvas();toast('Concept reset')}
function toggleSave(i){saved=saved.includes(i)?saved.filter(n=>n!==i):[...saved,i];try{localStorage.setItem('nodeway-shortlist',JSON.stringify(saved))}catch{}render();toast(saved.includes(i)?'Added to your shortlist':'Removed from shortlist')}
function setHomeFilter(f){homeFilter=f;render()}
function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');document.body.append(d);setTimeout(()=>d.remove(),2200)}
function jumpNode(id){selectedNode=id;if(mode===3){let idx=folders.findIndex(f=>f.ids.includes(id));if(idx>=0)folder=idx}if(mode===9)searchNode=id;updateExperience();$('#announce').textContent='Showing '+nodes[id].title}
function treeScale(d){treeZoom=Math.min(1.6,Math.max(.55,treeZoom+d));updateExperience()}
function canvasScale(d){canvasZoom=Math.min(1.4,Math.max(.35,canvasZoom+d));updateExperience()}
function fitCanvas(){canvasZoom=Math.min(1,Math.max(.35,($('.canvas').clientWidth-20)/780));updateExperience()}
function stopPlay(){clearInterval(timer);timer=null;playing=false}
function setReplay(i){stopPlay();replay=Math.max(0,Math.min(4,i));updateExperience()}
function togglePlay(){if(playing){stopPlay();updateExperience();return}if(replay===4)replay=0;playing=true;updateExperience();timer=setInterval(()=>{replay++;if(replay>=4){replay=4;stopPlay()}if(mode===6)updateExperience();else stopPlay()},1600)}
function updateSearchResults(){let el=$('#search-results');if(el)el.innerHTML=searchResults()}
let dragged=false;
function startDrag(e,id){if(e.button!==0)return;dragged=false;let el=e.currentTarget,p=positions.find(x=>x.id===id),x=e.clientX,y=e.clientY,ox=p.x,oy=p.y;el.setPointerCapture(e.pointerId);const move=ev=>{let dx=(ev.clientX-x)/canvasZoom,dy=(ev.clientY-y)/canvasZoom;if(Math.abs(dx)+Math.abs(dy)>4)dragged=true;if(!dragged)return;p.x=Math.max(0,Math.min(625,ox+dx));p.y=Math.max(0,Math.min(425,oy+dy));el.style.left=p.x+'px';el.style.top=p.y+'px';$('#canvas-lines').innerHTML=canvasLines()};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function canvasClick(e,id){if(dragged&&e.detail!==0){dragged=false;return}jumpNode(id)}
window.nodewayConceptDesign={pause:()=>{stopPlay();updateExperience();},context:()=>({kind:'sample-concept',concept:mode,selectedNode,hand,replay})};
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(mode!==9)return;if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#node-search')?.focus()}if(e.key==='Enter'&&document.activeElement.id==='node-search'){let n=matches()[0];if(n){searchNode=n.id;updateExperience()}}});route();
</script><script type="module" src="concepts-feedback.js?v=a05147447f6f9e50"></script></body></html>
